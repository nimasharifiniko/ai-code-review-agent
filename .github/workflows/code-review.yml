# AI Code Review workflow.
#
# Triggers on Pull Request "opened" and "synchronize" (new commits
# pushed to an existing PR). We intentionally do NOT trigger on
# "push" or PR "closed" events — this workflow only needs to run
# when there is new PR content to review.
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

# Least-privilege permissions:
# - contents: read   -> needed to checkout the repository code.
# - pull-requests: write -> needed to post the AI review as a
#   comment on the Pull Request via `gh pr comment`.
permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    # This MVP intentionally uses a GitHub-hosted runner instead of a
    # self-hosted one. Ollama is installed fresh on this ephemeral
    # runner for every run — this does NOT use the developer's local
    # Ollama instance running on their Windows machine, which would
    # be unreachable from GitHub Actions.
    runs-on: ubuntu-latest

    env:
      # GITHUB_TOKEN is automatically created and provided by GitHub
      # Actions for every workflow run — it is NOT a manually created
      # repository secret and must never be replaced with a personal
      # access token (PAT). Its effective permissions are controlled
      # entirely by the "permissions" block above.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GH_TOKEN is read by the GitHub CLI (gh) for authentication.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # LLM provider configuration. The existing application code
      # reads LLM_PROVIDER (not a differently named variable).
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
      OLLAMA_TIMEOUT: "120"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          # Run the Ollama server in the background and detach it
          # from this step so the workflow can continue.
          nohup ollama serve > ollama.log 2>&1 &

      - name: Wait for Ollama to be ready
        run: |
          echo "Waiting for Ollama to become ready..."
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              exit 0
            fi
            echo "Ollama not ready yet (attempt $i/30), retrying in 2s..."
            sleep 2
          done
          echo "Ollama did not become ready in time."
          exit 1

      - name: Pull qwen2.5-coder:7b model
        run: ollama pull qwen2.5-coder:7b

      - name: Run AI Code Review agent
        run: |
          python -m src.agent \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}" \
            "${{ github.event.pull_request.number }}" \
            > review.md || {
              status=$?
              echo "AI Code Review agent failed:"
              cat review.md
              exit $status
            }

      - name: Post review as Pull Request comment
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file review.md